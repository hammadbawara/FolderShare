name: Release App

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

  check:
    name: Run Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  build-android:
    name: Android
    needs: version
    uses: ./.github/workflows/build_android.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  build-linux:
    name: Linux
    needs: version
    uses: ./.github/workflows/build_linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  build-windows:
    name: Windows
    needs: version
    uses: ./.github/workflows/build_windows.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    needs: [check, build-android, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256 Checksums:"
          cat SHA256SUMS.txt

      - name: Determine Release Type (Pre-release vs Stable)
        id: release_type
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Release type: PRE-RELEASE ($TAG)"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Release type: STABLE ($TAG)"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Folder Share ${{ github.ref_name }}
          draft: false
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
