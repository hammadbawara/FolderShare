name: Build Android

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag or string (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag or string (e.g. 1.0.0)'
        required: false
        default: ''
        type: string

jobs:
  build:
    name: Build Signed Android Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0.0"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building Android version: $VERSION"

      # The plugin reads secrets directly from env and decodes the Base64 keystore automatically
      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease -PappVersion="${{ steps.version.outputs.version }}"

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          VERSION="${{ steps.version.outputs.version }}"

          # Locate and copy APK
          APK_FILE=$(find androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" "dist/FolderShare-${VERSION}-android.apk"
          else
            echo "::error::No APK found in androidApp/build/outputs/apk/release"
            exit 1
          fi

          echo "Prepared Android artifacts:"
          ls -lh dist/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: dist/*
          retention-days: 1
          if-no-files-found: error
